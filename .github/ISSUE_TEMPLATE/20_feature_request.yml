name: "💡 Feature request"
description: "Suggest an idea for this project"
title: "[Suggestion]: "
labels: [ "Suggestion" ]
body:
- type: markdown
  attributes:
    value: "Please search [here](https://github.com/nykonhrytsyshyn/SuggestionsBot/issues?q=label%3ASuggestion) to see if there is already an issue related to the feature you're requesting."
      
- type: textarea
  attributes:
    label: "Is your feature request related to a problem?"
    description: "A clear and concise description of what the problem is."
    placeholder: "I am trying to do [...] but [...]"
  validations:
    required: false
    
- type: textarea
  attributes:
    label: "Describe the solution you'd like"
    description: |
      A clear and concise description of what you want to happen. Include any alternative solutions you've considered.
  validations:
    required: true

- type: textarea
  attributes:
    label: "Additional context"
    description: |
      Screenshots? Configuration snippets? Anything that gives more context about the feature request.  

      Tip: You can attach images or log files by clicking on the area below and dragging the files there.
  validations:
    required: false

- type: checkboxes
  attributes:
    label: "Acknowledgements"
    description: "Your issue will be closed if you haven't done these steps."
    options: 
      - label: "I have searched the existing issues and this is a new issue and not a duplicate of any another open issue."
        required: true
      - label: "I have written a short but informative title."
        required: true
      - label: "I have filled out all of the requested information in this issue properly."
        required: true
