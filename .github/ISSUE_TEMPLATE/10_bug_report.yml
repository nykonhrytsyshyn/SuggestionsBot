name: "🐞 Bug Report"
description: "Create a report about something that is not working"
title: "[Bug]: "
labels: [ "Bug" ]
body:
- type: markdown
  attributes:
    value: |
      # Bug report instructions
      - Your issue may have already been reported before, so please check for existing issues [here](https://github.com/nykonhrytsyshyn/SuggestionsBot/issues?q=label%3ABug) before reporting any bugs.
      - Make sure you are using the latest bot build available.
      - If the bug is related to a version under development, please indicate this below.

- type: checkboxes
  attributes:
    label: "Are you using a version under development?"
    options:
    - label: "Yes, and I confirmed that my issue is relevant with the latest unreleased commit"
      required: false

- type: dropdown
  attributes: 
    label: "Issue type"
    description: "Type of the issue you want to describe."
    options: 
      - Source code related
      - Configuration related
      - Documentation related
      - CI/CD related
      - Infrastructure related
      - Other
  validations:
    required: true

- type: input
  attributes: 
    label: "Bot version"
    description: |
      Provide the version of SuggestionBot you are using.
      - If using Docker: provide the image tag (`latest`, `dev`, etc).
      - If using local build: provide the commit SHA.
      - Default: `latest`.
    placeholder: "Example: v0.0.1; commit 5864927...; tag suggestions-bot:1.0.0"
    value: "latest"
  validations:
    required: true
      
- type: textarea
  attributes:
    label: "Describe the bug"
    description: "A clear and concise description of what the bug is."
  validations:
    required: true
    
- type: textarea
  attributes:
    label: "Expected Behavior"
    description: "A clear and concise description of what you expected to happen."
  validations:
    required: false
    
- type: textarea
  attributes:
    label: "Steps To Reproduce"
    description: "Specify clear and concise step-by-step actions to reproduce the problem."
  validations:
    required: false

- type: textarea
  attributes:
    label: "Additional context"
    description: |
      Logs? Screenshots? Configuration snippets? Anything that gives more context about the issue.  

      Tip: You can attach images or log files by clicking on the area below and dragging the files there.
  validations:
    required: false

- type: checkboxes
  attributes:
    label: "Acknowledgements"
    description: "Your issue will be closed if you haven't done these steps."
    options: 
      - label: "I have searched the existing issues and this is a new issue and not a duplicate of any another open issue."
        required: true
      - label: "I have written a short but informative title."
        required: true
      - label: "I have filled out all of the requested information in this issue properly."
        required: true
