spring:
  application:
    name: SuggestionsWorker
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 10000
      validation-timeout: 2000
      max-lifetime: 600000
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: ${RABBITMQ_DEFAULT_VHOST}
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
        exclude: env, beans, shutdown, loggers, heapdump
  endpoint:
    health:
      access: read_only
      show-details: always
  info:
    env:
      enabled: true
  health:
    # Implemented in a custom silent way, see RabbitHealthIndicator
    rabbit:
      enabled: false
    # Implemented in a custom silent way, see RedisHealthIndicator
    redis:
      enabled: false
  metrics:
    enable:
      all: true
  server:
    port: ${WORKER_PORT}

logging:
  level:
    root: info
    com.zaxxer.hikari.pool: warn
    org.postgresql: warn
    org.springframework.jdbc.datasource: error
