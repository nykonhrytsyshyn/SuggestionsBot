# ⚠️ WARNING: DO NOT USE IN PRODUCTION
#
# This file defines the full development environment for SuggestionsBot.
# (Use by overriding the base "docker-compose.yml" file.)
# It includes:
#   - Core application services (bot, worker)
#   - Supporting infrastructure (Postgres, Redis, RabbitMQ)
#   - Monitoring & visualization tools (Prometheus, Grafana)
#
# Key points:
#   - Services are network-isolated (bridge network).
#   - Only Grafana is exposed by default; others are internal-only.
#   - Additional override files can change behavior:
#       - docker-compose.dev.expose.yml  → expose all ports for local testing
#       - docker-compose.dev.builder.yml → add builder service for artifacts
#
# Usage with ./scripts/dev.sh:
#
# Commands:
#   build           🔨 Build the application artifacts in the builder service only
#   up              🚀 Start all containers without rebuilding artifacts
#   all             🛠️ Build artifacts and start all containers in one command
#   down            🛑 Stop and remove all running containers
#   clean           🧹 Stop containers and remove containers, volumes, and images
#
# Optional flags:
#   --expose-ports  🔓 Expose development ports externally (use with up/all)
#
# Volumes are used for persistent data and build caching.
# All services share the same network: "suggestionsbot-net".

name: suggestionsbot-dev

# Common defaults for services.
# Reused via "<<: *defaults" to avoid duplication.
x-defaults: &defaults
  env_file:
    - ".env"
    - ".env.build"
  restart: always
  networks:
    - suggestionsbot-net

services:
  # ========================= #
  # Core application services #
  # ========================= #

  # Main bot service.
  bot:
    <<: *defaults
    build:
      context: ..
      dockerfile: docker/service-bot/dev.Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - build-artifacts:/app

  # Worker service for background processing.
  worker:
    <<: *defaults
    build:
      context: ..
      dockerfile: docker/service-worker/dev.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - build-artifacts:/app

  # ========================= #
  # Supporting infrastructure #
  # ========================= #

  # RabbitMQ message broker.
  rabbitmq:
    <<: *defaults
    container_name: service_rabbitmq
    image: rabbitmq:4.1-management-alpine
    expose:
      - "${RABBITMQ_PORT}"
      - "${RABBITMQ_WEB_PORT}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database.
  postgres:
    <<: *defaults
    container_name: db_postgres
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "${POSTGRES_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis cache and pub/sub.
  redis:
    <<: *defaults
    container_name: db_redis
    image: redis:7-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - redis-data:/data
    expose:
      - "${REDIS_PORT}"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

# Volumes definition.
# Used for persistent storage outside of containers.
volumes:
  gradle-cache:
    driver: local
  build-artifacts:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
