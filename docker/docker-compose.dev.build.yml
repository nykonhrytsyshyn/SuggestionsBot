# ⚠️ WARNING: DO NOT USE IN PRODUCTION
#
# This file overrides the "docker-compose.dev.yml" file.
# It introduces a dedicated "builder" service that compiles application
# artifacts (e.g. JARs, compiled classes) in an isolated container.
#
# Motivation:
#   - Keeps the build environment separate from runtime containers.
#   - Ensures consistent, reproducible builds inside Docker (no host dependencies).
#   - Shares build results with other services through a named volume.
#
# Usage examples:
#   - Rebuild artifacts without starting all services:
#       ./scripts/dev.sh build
#
#   - Run full environment, including the builder:
#       ./scripts/dev.sh all
#
# After the builder finishes successfully, dependent services (bot, worker)
# will start automatically, if command is "all", using artifacts placed in
# "build-artifacts:/output".
#
# This setup is intended for local development and CI pipelines,
# not for production deployments.

# Defaults for services that depend on the builder service
# Reused via "<<: *depends-on-builder" to avoid duplication.
x-depends-on-builder: &depends-on-builder
  depends_on:
    builder:
      condition: service_completed_successfully

services:
  # The builder service is responsible for building the application artifacts
  # and placing them in a shared volume "build-artifacts:/output".
  builder:
    container_name: service_builder
    env_file:
      - ".env"
      - ".env.build"
    build:
      context: ..
      dockerfile: docker/builder/Dockerfile
    volumes:
      - build-artifacts:/output
      - gradle-cache:/home/gradle/.gradle

  # The "bot" service is expected to be defined in the base dev file.
  # Here, it is configured to wait until the builder has finished successfully.
  bot:
    <<: *depends-on-builder

  # The "worker" service is expected to be defined in the base dev file.
  # It will also wait until the builder has finished successfully.
  worker:
    <<: *depends-on-builder
